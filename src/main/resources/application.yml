spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          cognito:
            client-id: ${COGNITO_CLIENT_ID:placeholder-client-id}
            client-secret: ${COGNITO_CLIENT_SECRET:placeholder-client-secret}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: "Amazon Cognito"
            authorization-grant-type: authorization_code
        provider:
          cognito:
            authorization-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_placeholder/oauth2/authorize
            token-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_placeholder/oauth2/token
            jwk-set-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_placeholder/.well-known/jwks.json
            user-info-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_placeholder/oauth2/userInfo
            user-name-attribute: sub

server:
  port: 8080
