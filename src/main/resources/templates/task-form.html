<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Form</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; max-width: 600px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        .btn { padding: 0.5rem 1rem; border: none; background-color: #007bff; color: white; cursor: pointer; border-radius: 4px; }
        .btn-cancel { background-color: #6c757d; }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>
    <h1 th:text="${task.id == null ? 'Create Task' : 'Edit Task'}">Task</h1>

    <form th:action="${task.id == null ? '/tasks' : '/tasks/' + task.id}" th:object="${task}" method="post">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label for="tagsString">Tags (comma separated)</label>
            <input type="text" id="tagsString" name="tagsString" th:value="${tagsString}" placeholder="e.g. work, urgent, home">
        </div>

        <button type="submit" class="btn">Save</button>
        <a href="/" class="btn btn-cancel">Cancel</a>
    </form>
</body>
</html>
