<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Share Task</title>
    <style>
        :root {
            --primary-color: #28a745;
            --primary-hover: #218838;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --border-color: #ced4da;
            --card-bg: #fff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        .container {
            width: 100%;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #343a40;
            margin-top: 0;
            margin-bottom: 5px;
            text-align: center;
            font-size: 1.5rem;
        }
        .task-preview {
            text-align: center;
            color: #6c757d;
            font-size: 1.1rem;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(40,167,69,0.25);
        }
        .help-text {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 5px;
        }
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1rem;
            text-align: center;
            flex: 1;
            transition: background-color 0.2s;
            text-decoration: none;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-cancel {
            background-color: #f8f9fa;
            color: #495057;
            border: 1px solid #ced4da;
        }
        .btn-cancel:hover { background-color: #e2e6ea; }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
        }
        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .alert-danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        @media (max-width: 500px) {
            .container { margin: 20px 10px; padding: 20px; }
            .form-actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Share Task</h1>
        <div class="task-preview" th:text="${task.title}">Task Title Preview</div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/tasks/{id}/share(id=${task.id})}" method="post">
            <div class="form-group">
                <label for="usernameOrEmail">Collaborator Details</label>
                <input type="text" id="usernameOrEmail" name="usernameOrEmail" required placeholder="Enter exact username or email">
                <div class="help-text">They must have logged into the app at least once via Cognito.</div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Share Task</button>
                <a href="/" class="btn btn-cancel">Back to Tasks</a>
            </div>
        </form>
    </div>
</body>
</html>
